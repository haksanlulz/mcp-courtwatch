name: CI

# The "a stranger clones this and runs npm test" channel. Until 2026-07-29 that
# channel was verified on exactly one machine — the author's — which is not a
# channel, it is a habit.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL and vitest 4 pulls rolldown/vite 8, which require
        # ^20.19.0 || >=22.12.0 — `npm ci` cannot even install there. The dev
        # toolchain's floor is not the PUBLISHED package's floor, though: the
        # tarball ships dist/ plus the MCP SDK and nothing else, so the consumer
        # channel is proven separately in the package job below.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The artifact rung. A green suite is not evidence the published package
  # starts: on 2026-07-29 this repo had both, and the installed binary died on
  # launch because npm's bin shim could not honour a `npx tsx` shebang.
  # pack-probe packs the real tarball, installs it into a throwaway project with
  # no source on disk, and speaks MCP to the binary through its bin shim.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The consumer channel, tested on the OLDEST Node anyone might still be
        # running. This is the honest place for 18: a stranger installing the
        # published tarball never touches vitest.
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:pack
