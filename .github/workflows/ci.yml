name: CI

# The "a stranger clones this and runs npm test" channel. Until 2026-07-29 that
# channel was verified on exactly one machine — the author's — which is not a
# channel, it is a habit.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Read-only by default. This workflow only checks out and tests; it needs no
# write scope, and inheriting the repository default would grant more than that.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL and vitest 4 pulls rolldown/vite 8, which require
        # ^20.19.0 || >=22.12.0 — `npm ci` cannot even install there. The dev
        # toolchain's floor is not the PUBLISHED package's floor, though: the
        # tarball ships dist/ plus the MCP SDK and nothing else, so the consumer
        # channel is proven separately in the package job below.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The artifact rung, in TWO STAGES.
  #
  # Stage 1 builds and packs on a Node the toolchain can actually run, and
  # uploads the tarball. Stage 2 downloads it and consumes it on every Node a
  # user might have, INCLUDING ones that cannot build here: vitest 4 pulls
  # vite 8 (Node ^20.19 || >=22.12), so `npm ci` dies on 18 — but the shipped
  # tarball is only dist/ plus the MCP SDK. A single-stage job conflated the
  # toolchain's floor with the package's and could only ever test the former.
  #
  # This is what turns the engines field from a support statement into a
  # measurement.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run verify:pack
      - run: npm pack --silent > .tgzname
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: "*.tgz"
          retention-days: 1

  # Stage 2: what a stranger actually does — install the published tarball and
  # speak MCP to it. Node 18 is here and nowhere else, because this is the only
  # stage that does not need the dev toolchain.
  consume:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: consume the published tarball
        run: |
          tgz=$(ls *.tgz | head -1)
          echo "consuming $tgz on node $(node -v)"
          PACK_PROBE_TARBALL="$PWD/$tgz" node scripts/pack-probe.mjs
